<canvas id="c" style="width:100%;height:100%;display:block"></canvas>
<script>
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var settings = { color: '#ffb36b', seconds: true, reactivity: 1 };
  var bins = new Array(64).fill(0);
  var pulse = 0;

  deskforge.settings.all().then(function (s) { settings = s; });
  deskforge.settings.onChange(function (s) { settings = s; });
  deskforge.audio.onSpectrum(function (b) { bins = b; });
  deskforge.audio.onBeat(function () { pulse = 1; });

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
  }
  window.addEventListener('resize', resize);
  resize();

  function hand(cx, cy, angle, len, width) {
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(angle) * len, cy - Math.cos(angle) * len);
    ctx.stroke();
  }

  function draw() {
    requestAnimationFrame(draw);
    var W = canvas.width, H = canvas.height;
    var cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.34;
    var k = Number(settings.reactivity) || 0;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = settings.color;
    ctx.fillStyle = settings.color;
    ctx.lineCap = 'round';

    // Audio ring: one spoke per frequency bin.
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(2, R * 0.03);
    for (var i = 0; i < bins.length; i++) {
      var a = (i / bins.length) * Math.PI * 2;
      var len = R * 0.04 + bins[i] * R * 0.32 * k + pulse * R * 0.04;
      ctx.beginPath();
      ctx.moveTo(cx + Math.sin(a) * (R * 1.08), cy - Math.cos(a) * (R * 1.08));
      ctx.lineTo(cx + Math.sin(a) * (R * 1.08 + len), cy - Math.cos(a) * (R * 1.08 + len));
      ctx.stroke();
    }
    pulse *= 0.9;

    // Face and hands.
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(2, R * 0.02);
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

    var d = new Date();
    var s = d.getSeconds() + d.getMilliseconds() / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;
    ctx.globalAlpha = 1;
    hand(cx, cy, (h / 12) * Math.PI * 2, R * 0.5, R * 0.07);
    hand(cx, cy, (m / 60) * Math.PI * 2, R * 0.78, R * 0.045);
    if (settings.seconds) { ctx.globalAlpha = 0.7; hand(cx, cy, (s / 60) * Math.PI * 2, R * 0.9, R * 0.02); }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.05, 0, Math.PI * 2); ctx.fill();
  }
  draw();
</script>
