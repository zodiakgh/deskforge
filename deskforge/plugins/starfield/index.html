<canvas id="c" style="width:100%;height:100%;display:block;background:radial-gradient(120% 100% at 50% 100%,#17224a,#070a18)"></canvas>
<script>
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var settings = { color: '#cfe0ff', count: 420, speed: 1 };
  var stars = [];
  var bass = 0;

  function reseed() {
    stars = [];
    for (var i = 0; i < Number(settings.count); i++) {
      stars.push({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() });
    }
  }
  function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }

  deskforge.settings.all().then(function (s) { settings = s; reseed(); });
  deskforge.settings.onChange(function (s) { settings = s; reseed(); });
  deskforge.audio.onSpectrum(function (b) {
    var sum = 0;
    for (var i = 0; i < 6; i++) sum += b[i];
    bass = sum / 6;
  });
  window.addEventListener('resize', resize);
  resize();
  reseed();

  function draw() {
    requestAnimationFrame(draw);
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = settings.color;
    var v = (0.0025 + bass * 0.02) * Number(settings.speed);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.z -= v;
      if (s.z <= 0.02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
      var px = W / 2 + (s.x / s.z) * W * 0.25;
      var py = H / 2 + (s.y / s.z) * H * 0.25;
      if (px < 0 || px > W || py < 0 || py > H) continue;
      var size = (1 - s.z) * 2.6 + 0.3;
      ctx.globalAlpha = Math.min(1, (1 - s.z) * 1.4);
      ctx.fillRect(px, py, size, size);
    }
    ctx.globalAlpha = 1;
  }
  draw();
</script>
